version: v1
seed: 0
kappa: 10000.0
pseudocount: 1
log: natural

paths:
  vcc_data: /cluster/work/boeva/VCC/VCC2026/data
  vcc_rscript: /cluster/work/boeva/VCC/VCC2026/.pixi/envs/default/bin/Rscript
  repo_data: /cluster/work/boeva/virtual_cell_reasoning/data
  hgnc: /cluster/work/boeva/VCC/VCC2026/data/raw/hgnc/hgnc_complete_set_2026-10-06.txt
  python: /cluster/work/boeva/akalygina/conda/envs/vcell/bin/python

fetch:
  proxy: http://localhost:48080
  files_at_once: 6
  parts_per_file: 8

genes:
  ensembl_release: 112
  gtf: raw/ensembl112/Homo_sapiens.GRCh38.112.gtf.gz
  primary_assembly_only: true
  neighbor_window_bp: 5000
  mito_prefix: MT-

qc:
  min_genes: 500
  max_pct_mito: 20.0
  min_guide_umi: 20
  min_umi: 1000
  g0_control_detection_fraction: 0.05
  lane_flags:
    gse295214__hESC: [GSM8943771_jan_4_GEX_D2_sg_E11, GSM8943715_jan_10_GEX_C7_sg_F6]

profiles:
  authors: []
  strict: [qc_genes_500, qc_mito_20, qc_guide_20]

populations:
  min_cells_for_moments: 5
  min_controls_per_batch_floor: 5
  n_eff_flag_ratio: 4
  n_cells_flag: 20
  mwu_control_sample: 5000

halves:
  names: [all, A, B]

lib_size:
  author_total_when_partial: [replogle22_k562, replogle22_rpe1, replogle22_gwps, nadig25_hepg2, nadig25_jurkat, cd4t, vcc2025_h1, viperturb]

controls:
  is_control_kinds: [non_targeting, safe_targeting, non_targeting+safe_targeting, random_sequence]
  not_used_kinds: [unassigned, non_targeting_spike_in]
  including_unassigned: [feng]

guide_call_min_umi: {hesc: 20, mccutcheon23_cd8t_crispri: 5, mccutcheon23_cd8t_crispra: 5}

perturbation_direction:
  default: down
  up: [scperturb_norman, joung23_tf_atlas, mccutcheon23_cd8t_crispra, tian21_neurons_crispra]

cell_rules:
  default:
    keep: exactly_one_assigned_construct
    drop: [no_guide, multi_guide]
  designed_combinations_kept: [scperturb_norman, scperturb_wessels, scperturb_sunshine, replogle20, wessels23_hek293ft, wessels23_perturbseq, adamson16_other_lanes]
  feng:
    keep: [exactly_one_guide, unassigned_as_controls]
  dld1:
    keep: low_moi_singlets
  authority:
    default: every checked paper except Feng excludes guide-less cells and treats undesigned multi-guide cells as doublets; Anna 2026-11-04
    scperturb_sunshine: Sunshine et al. 2023 Nat Commun, Methods, only cells with one guide set per cell (obs match_type exact_match, one matched dual-sgRNA library element; the 22 two-gene elements are designed combinations); the 55-cells-per-element rule and the bottom-2% UMI and >20% mito filters are not applied
    scperturb_frangieh: multi-guide cells dropped (Anna 2026-11-04 evening)
    hesc: Pan et al. 2026, exactly one sgRNA with at least 20 barcode counts
    cd4t: Zhu et al. 2026 Cell, multi_sgRNA and no-gRNA cells excluded
    feng: Feng et al. 2026 Cell Genomics, unassigned + non-targeting cells are the control set
    dld1: Yeung et al. 2026, low-MOI singlets are the reference
    shifrut18_t_crisprko: Shifrut et al. 2018 Cell, cells with more than one assigned guide filtered out; the deposited calls list one guide per cell
    mccutcheon23_cd8t_crispri: McCutcheon et al. 2023 Nat Genet Methods, gRNAs assigned at gRNA UMI > 4 and cells grouped by gRNA identity (guide-less cells in no group, controls are cells with only NT gRNAs); the paper does not exclude multi-gRNA cells, the default rule drops them
    mccutcheon23_cd8t_crispra: McCutcheon et al. 2023 Nat Genet Methods, same rule as mccutcheon23_cd8t_crispri
    tian21_neurons_crispri: Tian et al. 2021 Nat Neurosci, only cells with a single sgRNA above the 4 SD UMI cutoff were retained
    tian21_neurons_crispra: Tian et al. 2021 Nat Neurosci, only cells with a single sgRNA above the 4 SD UMI cutoff were retained
    papalexi21_thp1: Papalexi et al. 2021 Nat Genet, the gRNA with most GDO counts is assigned, < 5 counts for every gRNA is negative, several high gRNAs is a doublet; negatives and doublets removed, only singlets deposited
    martinrufino25_hspc: Martin-Rufino et al. 2025 Science (bioRxiv methods), one sgRNA per cell from the CROP-seq enrichment library; cells without a detected sgRNA (8.9%) are not deposited, no multi-guide class
    wessels23_hek293ft: Wessels et al. 2023 Nat Methods, cells without a bcgRNA and cells with multiple bcgRNA assignments removed (CaRPool-seq MultiSeqDemux; stabRNA g1/g2 UMI rule); only assigned cells deposited
    wessels23_perturbseq: Wessels et al. 2023 Nat Methods, HTODemux doublets removed and only cells with the sgRNA number and combination of their pool retained; only those cells deposited
    adamson16_other_lanes: Adamson et al. 2016 Cell, one good-coverage guide barcode identity assigned, two or more a multiple, none unidentifiable
    joung23_tf_atlas: Joung et al. 2023 Cell, STAR Methods "SHARE-seq data preprocessing", one TF ORF per cell (top barcode with >10 reads and >50% more reads than the second); cells without a mapped ORF excluded by the authors

shard:
  bucket_rows: 65536
  chunk_cells: 20000
  gene_block_nnz: 200000000
  compression: gzip
  compression_level: 4
  chunk_elements: 1048576

moments:
  chunk_cells: 50000
  chunk_nnz: 300000000
  h5_chunks: [32, 2048]

slurm:
  partition: compute
  max_concurrent: 20
  caps: {shard: 4, shard_large: 3, moments: 12, deltas: 12, validate: 24}
  time: {default: "24:00:00", shard_large: "7-00:00:00"}
  memory_gb:
    shard: {default: 16, cd4t: 32, feng: 32, jiang: 24, kolf: 24, orion_hct116: 32, orion_hek293t: 32, scperturb_frangieh: 24, scperturb_wessels: 8, vcc2025_h1: 32, viperturb: 32}
    moments: {default: 8, cd4t: 16, kolf: 16, mcfaline: 16, nadig25_hepg2: 16, nadig25_jurkat: 16, orion_hct116: 24, orion_hek293t: 32, replogle22_gwps: 16, replogle22_k562: 16, replogle22_rpe1: 16, scperturb_sunshine: 16, joung23_tf_atlas: 16}
    deltas: {default: 8}
    validate: {default: 8, feng: 16, hesc: 16, kolf: 16, orion_hct116: 16, orion_hek293t: 16, scperturb_adamson: 16, joung23_tf_atlas: 32, martinrufino25_hspc: 16, tian21_neurons_crispri: 16, tian21_neurons_crispra: 16}
    scores: {default: 8, cd4t: 48, dld1: 16, hesc: 16, jiang: 32, kolf: 24, mcfaline: 16, orion_hct116: 32, orion_hek293t: 32, replogle22_gwps: 16, scperturb_adamson: 24, scperturb_frangieh: 24, scperturb_sunshine: 16, vcc2025_h1: 16, viperturb: 16, joung23_tf_atlas: 16, martinrufino25_hspc: 16}
  large_shards: [orion_hct116, orion_hek293t, kolf, cd4t]
  rerun_memory_factor: 1.3

reader:
  batch_depth_low_fraction: 0.5
  batch_control_shift_mad: 3.0
  min_cells_for_effect: 20
